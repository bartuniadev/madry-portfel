<!doctype html><html lang="pl"><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/user/madry-portfel/assets/fonts/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;}
  body{font-family:"Inter",system-ui,sans-serif;background:#faf9f6;color:#1f2a24;position:relative;overflow:hidden;}
  .bg{position:absolute;inset:0;background:radial-gradient(900px 500px at 105% 110%, #cfe8d8 0%, rgba(207,232,216,0) 60%), radial-gradient(600px 380px at -10% -20%, #e8f3ec 0%, rgba(232,243,236,0) 70%);}
  .bar{position:absolute;left:0;top:0;bottom:0;width:18px;background:linear-gradient(180deg,#1f7a4d,#145c39);}
  .wrap{position:absolute;left:84px;right:84px;top:70px;bottom:70px;display:flex;flex-direction:column;}
  .eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:#1f7a4d;font-weight:700;}
  .head{margin-top:26px;flex:1;display:flex;flex-direction:column;justify-content:center;}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:500;margin:0;color:#14261c;line-height:1.08;letter-spacing:-.01em;}
  .sub{margin-top:22px;font-size:32px;line-height:1.3;color:#4d5d55;}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:30px;}
  .brand{display:flex;align-items:center;gap:14px;font-family:"Fraunces",Georgia,serif;font-size:36px;color:#145c39;font-weight:500;}
  .brand svg{width:40px;height:40px;color:#1f7a4d;}
  .url{font-size:24px;color:#6b7a72;}
  .chart{position:absolute;right:70px;top:56px;opacity:.9}
</style></head><body>
<div class="bg"></div><div class="bar"></div>
<svg class="chart" width="220" height="90" viewBox="0 0 220 90"><polyline points="4,80 50,58 86,68 128,34 166,46 214,8" fill="none" stroke="#1f7a4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><circle cx="214" cy="8" r="7" fill="#e0a63f"/></svg>
<div class="wrap">
  <div class="eyebrow" id="eyebrow"></div>
  <div class="head"><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <div class="foot">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="7.5 13.5 10.5 10.5 13 12.5 16.5 8.5"/><polyline points="14 8.5 16.5 8.5 16.5 11"/></svg>Mądry Portfel</div>
    <div class="url">bartuniadev.github.io/madry-portfel</div>
  </div>
</div>
<script>
  window.render = function (eyebrow, title, sub) {
    document.getElementById('eyebrow').textContent = eyebrow;
    var h = document.getElementById('title'), s = document.getElementById('sub');
    h.textContent = title; s.textContent = sub || ''; s.style.display = sub ? '' : 'none';
    var head = document.querySelector('.head'), size = 76;
    h.style.fontSize = size + 'px';
    while (size > 40 && head.scrollHeight > head.clientHeight) { size -= 2; h.style.fontSize = size + 'px'; s.style.fontSize = Math.max(24, Math.round(size * 0.42)) + 'px'; }
  };
</script></body></html>
